name: Windows app

# Builds desktop/dist/Grainfall.exe on a Windows machine and attaches it to the
# workflow run as a downloadable artifact.
on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build Grainfall.exe
        run: |
          python make_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --hidden-import PIL._tkinter_finder --name Grainfall --icon grainfall.ico run.py

      - name: Check the app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Grainfall.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Grainfall.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: Grainfall-windows
          path: desktop/dist/Grainfall.exe
